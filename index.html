<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحاسب الآلي المصغر | Micro Business Accountant</title>
    <style>
        :root {
            --bg-color: #F4F7F6;
            --card-bg: #FFFFFF;
            --primary: #1F4E5B;
            --primary-dark: #153740;
            --accent-green: #2E8B57;
            --accent-red: #D9534F;
            --text-dark: #2C3E50;
            --text-muted: #7F8C8D;
            --border-color: #E2E8F0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            padding: 15px;
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 20px 10px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        header h1 { font-size: 1.6rem; margin-bottom: 5px; }
        header p { font-size: 0.9rem; opacity: 0.9; }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .kpi-card {
            background: var(--card-bg);
            padding: 18px;
            border-radius: 10px;
            border-right: 5px solid var(--primary);
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            text-align: center;
        }

        .kpi-card.profit { border-right-color: var(--accent-green); }
        .kpi-title { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; }
        .kpi-value { font-size: 1.4rem; font-weight: bold; color: var(--primary-dark); }
        .kpi-card.profit .kpi-value { color: var(--accent-green); }

        .section-box {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }

        .section-box h2 {
            font-size: 1.2rem;
            color: var(--primary);
            margin-bottom: 15px;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 8px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 0.8rem;
            margin-bottom: 4px;
            color: var(--text-dark);
            font-weight: 600;
        }

        .input-group input, .input-group select {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            background-color: #FFFDF5;
        }

        .btn-submit {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 11px 20px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-submit:hover { background-color: var(--primary-dark); }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 0.85rem;
        }

        table th, table td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        table th { background-color: var(--bg-color); color: var(--primary-dark); }

        .btn-delete {
            background: none;
            border: none;
            color: var(--accent-red);
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>📊 المحاسب الآلي المصغر</h1>
        <p>تتبع أرباحك وتكاليفك بدقة وبسرعة بالدينار الليبي</p>
    </header>

    <!-- لوحة المؤشرات KPIs -->
    <div class="dashboard-grid">
        <div class="kpi-card">
            <div class="kpi-title">إجمالي المبيعات</div>
            <div class="kpi-value" id="kpi-total-sales">0.00 د.ل</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-title">إجمالي التكاليف</div>
            <div class="kpi-value" id="kpi-total-cost">0.00 د.ل</div>
        </div>
        <div class="kpi-card profit">
            <div class="kpi-title">صافي الربح الفعلي</div>
            <div class="kpi-value" id="kpi-net-profit">0.00 د.ل</div>
        </div>
    </div>

    <!-- قسم إدخال المنتجات وتسعيرها -->
    <div class="section-box">
        <h2>1️⃣ تسعير منتج جديد</h2>
        <form id="product-form">
            <div class="form-grid">
                <div class="input-group">
                    <label>اسم المنتج</label>
                    <input type="text" id="p-name" placeholder="مثال: علبة شوكولاتة" required>
                </div>
                <div class="input-group">
                    <label>تكلفة المواد (د.ل)</label>
                    <input type="number" step="0.25" id="p-raw" placeholder="0.00" required>
                </div>
                <div class="input-group">
                    <label>تكلفة التغليف (د.ل)</label>
                    <input type="number" step="0.25" id="p-pkg" placeholder="0.00" value="0">
                </div>
                <div class="input-group">
                    <label>سعر البيع (د.ل)</label>
                    <input type="number" step="0.25" id="p-price" placeholder="0.00" required>
                </div>
            </div>
            <button type="submit" class="btn-submit">+ إضافة المنتج للقائمة</button>
        </form>

        <table id="products-table">
            <thead>
                <tr>
                    <th>المنتج</th>
                    <th>إجمالي التكلفة</th>
                    <th>سعر البيع</th>
                    <th>ربح القطعة</th>
                    <th>حذف</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- قسم تسجيل المبيعات اليومية -->
    <div class="section-box">
        <h2>2️⃣ تسجيل عملية بيع</h2>
        <form id="sale-form">
            <div class="form-grid">
                <div class="input-group">
                    <label>اختر المنتج</label>
                    <select id="s-product" required></select>
                </div>
                <div class="input-group">
                    <label>الكمية المباعة</label>
                    <input type="number" id="s-qty" min="1" value="1" required>
                </div>
            </div>
            <button type="submit" class="btn-submit" style="background-color: var(--accent-green);">+ تسجيل البيعة</button>
        </form>

        <table id="sales-table">
            <thead>
                <tr>
                    <th>المنتج</th>
                    <th>الكمية</th>
                    <th>الإجمالي</th>
                    <th>الربح</th>
                    <th>حذف</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        let products = JSON.parse(localStorage.getItem('app_products_ly')) || [];
        let sales = JSON.parse(localStorage.getItem('app_sales_ly')) || [];

        function saveData() {
            localStorage.setItem('app_products_ly', JSON.stringify(products));
            localStorage.setItem('app_sales_ly', JSON.stringify(sales));
            render();
        }

        document.getElementById('product-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('p-name').value;
            const raw = parseFloat(document.getElementById('p-raw').value) || 0;
            const pkg = parseFloat(document.getElementById('p-pkg').value) || 0;
            const price = parseFloat(document.getElementById('p-price').value) || 0;
            
            products.push({ id: Date.now(), name, totalCost: raw + pkg, price, margin: price - (raw + pkg) });
            e.target.reset();
            saveData();
        });

        document.getElementById('sale-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const prodId = parseInt(document.getElementById('s-product').value);
            const qty = parseInt(document.getElementById('s-qty').value) || 1;
            const prod = products.find(p => p.id === prodId);
            
            if (prod) {
                sales.push({
                    id: Date.now(),
                    name: prod.name,
                    qty,
                    revenue: prod.price * qty,
                    cost: prod.totalCost * qty,
                    profit: (prod.price - prod.totalCost) * qty
                });
                saveData();
            }
        });

        function deleteProduct(id) {
            products = products.filter(p => p.id !== id);
            saveData();
        }

        function deleteSale(id) {
            sales = sales.filter(s => s.id !== id);
            saveData();
        }

        function render() {
            const prodSelect = document.getElementById('s-product');
            const prodTbody = document.querySelector('#products-table tbody');
            prodSelect.innerHTML = '';
            prodTbody.innerHTML = '';

            products.forEach(p => {
                prodSelect.innerHTML += `<option value="${p.id}">${p.name} (${p.price.toFixed(2)} د.ل)</option>`;
                prodTbody.innerHTML += `
                    <tr>
                        <td>${p.name}</td>
                        <td>${p.totalCost.toFixed(2)} د.ل</td>
                        <td>${p.price.toFixed(2)} د.ل</td>
                        <td style="color: var(--accent-green); font-weight: bold;">${p.margin.toFixed(2)} د.ل</td>
                        <td><button class="btn-delete" onclick="deleteProduct(${p.id})">✕</button></td>
                    </tr>
                `;
            });

            const salesTbody = document.querySelector('#sales-table tbody');
            salesTbody.innerHTML = '';
            let totalSales = 0, totalCost = 0, netProfit = 0;

            sales.forEach(s => {
                totalSales += s.revenue;
                totalCost += s.cost;
                netProfit += s.profit;

                salesTbody.innerHTML += `
                    <tr>
                        <td>${s.name}</td>
                        <td>${s.qty}</td>
                        <td>${s.revenue.toFixed(2)} د.ل</td>
                        <td style="color: var(--accent-green); font-weight: bold;">${s.profit.toFixed(2)} د.ل</td>
                        <td><button class="btn-delete" onclick="deleteSale(${s.id})">✕</button></td>
                    </tr>
                `;
            });

            document.getElementById('kpi-total-sales').innerText = `${totalSales.toFixed(2)} د.ل`;
            document.getElementById('kpi-total-cost').innerText = `${totalCost.toFixed(2)} د.ل`;
            document.getElementById('kpi-net-profit').innerText = `${netProfit.toFixed(2)} د.ل`;
        }

        render();
    </script>
</body>
</html>
